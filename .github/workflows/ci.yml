name: КВЕРАТО · проверка кода

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Проверка релизов и исходников
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
      - name: Подготовить Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить архивы v1.0
        run: python tools/release_audit.py
      - name: Проверить Python-синтаксис
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          root = pathlib.Path("bots")
          paths = list(root.rglob("*.py")) if root.exists() else []
          for path in paths:
              compile(path.read_bytes().decode("utf-8-sig"), str(path), "exec")
          print(f"Python: {len(paths)} модулей проверены")
          PY
      - name: Проверить ссылки документации
        run: python tools/check_docs_links.py
      - name: Проверить рабочие файлы, токены и Windows BAT
        run: python tools/repo_health.py
      - name: Проверить игровые операции и SQLite всех платформ
        run: python tools/core_smoke.py
      - name: Проверить еженедельные награды и миграцию с v1.0
        run: python tools/weekly_smoke.py
      - name: Проверить экран таймеров и отсутствие лишних начислений
        run: python tools/rewards_smoke.py
      - name: Проверить личные цели накопления и миграции базы
        run: python tools/goals_smoke.py
      - name: Проверить переводы, покупки и приватную выписку
        run: python tools/economy_regression.py
      - name: Проверить фильтры и страницы истории операций
        run: python tools/statement_pagination_smoke.py

  windows:
    name: Windows · игровой Smoke Test
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
      - name: Установить Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить BAT и защиту пользовательских файлов
        run: python tools/repo_health.py
      - name: Проверить операции SQLite на Windows
        run: python tools/core_smoke.py
      - name: Проверить еженедельные награды на Windows
        run: python tools/weekly_smoke.py
      - name: Проверить экран таймеров на Windows
        run: python tools/rewards_smoke.py
      - name: Проверить цели накопления на Windows
        run: python tools/goals_smoke.py
      - name: Проверить экономику и выписку на Windows
        run: python tools/economy_regression.py
      - name: Проверить фильтры и страницы выписки на Windows
        run: python tools/statement_pagination_smoke.py
