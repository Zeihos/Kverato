name: КВЕРАТО · проверка кода

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Проверка релизов и исходников
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
      - name: Подготовить Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить архивы v1.0
        run: python tools/release_audit.py
      - name: Проверить Python-синтаксис
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          root = pathlib.Path("bots")
          paths = list(root.rglob("*.py")) if root.exists() else []
          for path in paths:
              compile(path.read_bytes().decode("utf-8-sig"), str(path), "exec")
          print(f"Python: {len(paths)} модулей проверены")
          PY
      - name: Проверить ссылки документации
        run: python tools/check_docs_links.py
      - name: Проверить игровые операции и SQLite всех платформ
        run: python tools/core_smoke.py
      - name: Проверить отсутствие секретов
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import PurePosixPath
          forbidden = {".env", "__pycache__", ".pytest_cache"}
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          for raw in tracked:
              if not raw:
                  continue
              name = raw.decode("utf-8")
              path = PurePosixPath(name)
              if any(p in forbidden for p in path.parts):
                  raise SystemExit(f"Приватный файл в Git: {path}")
              if path.suffix.lower() in {".sqlite", ".sqlite3", ".pyc", ".pem", ".key"}:
                  raise SystemExit(f"Приватный файл в Git: {path}")
          print("Секретов, баз данных и кэша среди отслеживаемых файлов нет")
          PY
